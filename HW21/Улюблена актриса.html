    <h1>Зої Ядіра Салдана-Перего</h1>
    <p>Зої Ядіра Салдана-Перего (нар. 19 червня 1978 , Пассейік , Нью-Джерсі) - американська і домініканська кіноакторка, відома ролями в таких блокбастерах, як <a href="https://uk.wikipedia.org/wiki/%D0%90%D0%B2%D0%B0%D1%82%D0%B0%D1%80_(%D1%84%D1%96%D0%BB%D1%8C%D0%BC)"> «Аватар» </a>, <a href="https://uk.wikipedia.org/wiki/%D0%97%D0%BE%D1%80%D1%8F%D0%BD%D0%B8%D0%B9_%D1%88%D0%BB%D1%8F%D1%85_(%D1%84%D1%96%D0%BB%D1%8C%D0%BC)"> «Зоряний шлях»</a>, <a href="https://uk.wikipedia.org/wiki/%D0%9A%D0%BE%D0%BB%D0%BE%D0%BC%D0%B1%D1%96%D0%B0%D0%BD%D0%B0"> «Коломбіана» </a>,<a href="https://uk.wikipedia.org/wiki/%D0%92%D0%B0%D1%80%D1%82%D0%BE%D0%B2%D1%96_%D0%B3%D0%B0%D0%BB%D0%B0%D0%BA%D1%82%D0%B8%D0%BA%D0%B8"> «Вартові галактики» </a>.</p>
